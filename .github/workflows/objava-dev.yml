# Automatska objava child teme na dev.ladymom.me poslije svake izmjene na main grani.
# Radi preko zvaničnog cPanel UAPI-ja (VersionControl/update + VersionControlDeployment/create),
# isto kao klik na „Update from Remote“ i „Deploy HEAD Commit“ u cPanelu.
# Tajne (GitHub → Settings → Secrets and variables → Actions):
#   CPANEL_HOST  – adresa cPanela bez https://, npr. server123.hosting.me:2083
#   CPANEL_TOKEN – cPanel API token (Security → Manage API Tokens)
# Produkcija (ladymom.me) se NE objavljuje automatski.

name: Objava na dev

on:
  push:
    branches: [main]
    paths:
      - 'style.css'
      - 'functions.php'
      - 'inc/**'
      - 'woocommerce/**'
      - '.cpanel.yml'
  workflow_dispatch:

concurrency:
  group: objava-dev
  cancel-in-progress: false

jobs:
  objava:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_USER: ladymomm
      REPO_ROOT: /home/ladymomm/repositories/ladymom-tema
    steps:
      - uses: actions/checkout@v4

      - name: PHP provjera sintakse
        run: |
          for f in functions.php inc/*.php woocommerce/emails/*.php; do php -l "$f"; done

      - name: Povuci izmjene na server (Update from Remote)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          r=$(curl -sS --fail-with-body -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}/execute/VersionControl/update?repository_root=${REPO_ROOT}&branch=main")
          echo "$r" | jq '{status, errors, messages}'
          test "$(echo "$r" | jq -r .status)" = "1"

      - name: Objavi (Deploy HEAD Commit)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          r=$(curl -sS --fail-with-body -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}/execute/VersionControlDeployment/create?repository_root=${REPO_ROOT}")
          echo "$r" | jq '{status, errors, messages}'
          test "$(echo "$r" | jq -r .status)" = "1"

      - name: Provjeri da sajt radi
        run: |
          sleep 20
          for u in / /korpa/ /proizvod/test-artikal-ne-kupovati/ /kontakt/; do
            code=$(curl -s -o page.html -w '%{http_code}' "https://dev.ladymom.me${u}?ci=${GITHUB_SHA}")
            echo "$u -> $code"
            test "$code" = "200"
            ! grep -qiE 'Fatal error|critical error' page.html
          done
